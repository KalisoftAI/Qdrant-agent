{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="max-w-4xl mx-auto px-4 space-y-16">
    <section id="chat-container" class="bg-white dark:bg-gray-800 rounded-2xl shadow-lg border border-gray-200 dark:border-gray-700 overflow-hidden">
        <div class="p-4 bg-gray-50 dark:bg-gray-900/50 border-b border-gray-200 dark:border-gray-700 flex justify-between items-center">
            <h2 class="text-lg font-bold">Screening Conversation</h2>
            <button id="reset-button" class="text-sm text-white bg-red-600 hover:bg-red-700 font-medium rounded-lg px-4 py-2 transition-colors">
                Start Over
            </button>
        </div>
        
        <div id="chat-history" class="p-6 h-96 overflow-y-auto space-y-6"></div>
        
        <div class="p-4 bg-gray-50 dark:bg-gray-800/50 border-t border-gray-200 dark:border-gray-700">
            <form id="chat-form" class="flex items-center gap-4">
                {% csrf_token %}
                <input type="text" id="question-input" class="w-full bg-gray-100 dark:bg-gray-700 border-gray-300 dark:border-gray-600 text-gray-900 dark:text-white text-sm rounded-lg focus:ring-teal-500 focus:border-teal-500 block p-3 transition" placeholder="Type your answer here..." required>
                <button type="submit" id="submit-button" class="inline-flex items-center justify-center p-3 text-sm font-medium text-white bg-teal-600 rounded-lg hover:bg-teal-700 focus:ring-4 focus:outline-none focus:ring-teal-300 dark:bg-teal-500 dark:hover:bg-teal-600 dark:focus:ring-teal-800 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M12 5l7 7-7 7"></path></svg>
                </button>
            </form>
        </div>
    </section>

    <section id="appointments-section" class="bg-white dark:bg-gray-800 rounded-2xl shadow-lg p-6 border border-gray-200 dark:border-gray-700">
        <h2 class="text-2xl font-bold text-gray-900 dark:text-white mb-4">My Appointments</h2>
        <div id="appointments-list" class="space-y-4">
            <p class="text-gray-500 dark:text-gray-400">Your appointment statuses will appear here.</p>
        </div>
    </section>
</div>

<div id="booking-modal-backdrop" class="hidden fixed inset-0 bg-gray-900 bg-opacity-75 transition-opacity"></div>
<div id="booking-modal" class="hidden fixed inset-0 z-10 w-screen overflow-y-auto">
    <div class="flex min-h-full items-end justify-center p-4 text-center sm:items-center sm:p-0">
        <div id="modal-panel" class="relative transform overflow-hidden rounded-lg bg-white dark:bg-gray-800 text-left shadow-xl transition-all sm:my-8 sm:w-full sm:max-w-lg">
        </div>
    </div>
</div>
{% endblock %}
